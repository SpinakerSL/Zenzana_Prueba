<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3D0A1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zenzana">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<title>Zenzana · Inventario</title>
</head>
<body>
<main id="view"></main>

<nav id="tabs" aria-label="Secciones">
  <button data-action="tab" data-tab="sesion"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/></svg><span>Sesión</span></button>
  <button data-action="tab" data-tab="inventario"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg><span>Inventario</span></button>
  <button data-action="tab" data-tab="tratamientos"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M7.5 15h9"/></svg><span>Tratamientos</span></button>
  <button data-action="tab" data-tab="resultados"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M2 20h20"/></svg><span>Resultados</span></button>
  <button data-action="tab" data-tab="ajustes"><svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Ajustes</span></button>
</nav>

<div id="sheet" class="sheet-wrap hidden">
  <div class="backdrop" data-action="closeSheet"></div>
  <div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
</div>
<div id="toast" class="toast hidden"></div>
<input type="file" id="fileImport" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="fileRestore" accept=".json,application/json" hidden>

<script src="vendor/xlsx.mini.min.js"></script>
<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
